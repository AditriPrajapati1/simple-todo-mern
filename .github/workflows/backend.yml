name: Backend CI/CD
on:
   workflow_dispatch:
   push:
     branches: [main]
     paths: ['backend/**'] # only when backend code changes
jobs:
    build-and-push:
       runs-on: ubuntu-latest
       steps:
          - uses: actions/checkout@v4
          - name: Build and push
            run: bash scripts/build-and-push.sh
            env:
                DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
                IMAGE: mern-server
                CONTEXT: ./backend

    deploy:
       needs: build-and-push # only after the image is pushed
       runs-on: ubuntu-latest
       steps:
          - uses: actions/checkout@v4
          - name: Deploy to EC2
            run: bash scripts/deploy.sh
            env:
                DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                IMAGE: mern-server
                CONTAINER: mern-server
                PORT: 4200
                EC2_HOST: ${{ secrets.EC2_HOST }}
                EC2_USER: ${{ secrets.EC2_USER }}
                EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      



