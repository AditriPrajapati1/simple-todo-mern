services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: todo-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://mongodb:27017/simple-mern-todo
      PORT: 5000

  frontend:
    build: ./frontend
    container_name: todo-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data: